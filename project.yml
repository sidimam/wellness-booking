name: WellnessBooking
options:
  bundleIdPrefix: com.sdimambro
  developmentLanguage: it
  xcodeVersion: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 17
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X5SR67A8AL
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  WellnessBooking:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WellnessBooking
      - path: Shared
      - path: Localizable.xcstrings
      - path: Icons/AppIcon.icon
        type: file
      - path: Icons/AppIcon-blu.icon
        type: file
      - path: Icons/AppIcon-verde.icon
        type: file
      - path: Icons/AppIcon-arancione.icon
        type: file
      - path: Icons/AppIcon-viola.icon
        type: file
      - path: Icons/AppIcon-rosso.icon
        type: file
      - path: Icons/AppIcon-grafite.icon
        type: file
    dependencies:
      - target: WellnessBookingWatch
      - target: WellnessBookingWidget
    # Entitlements: modificali QUI, xcodegen riscrive il file.
    entitlements:
      path: SupportFiles/iOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.sdimambro.wellness-booking
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.sdimambro.wellness-booking
        com.apple.developer.associated-domains:
          - webcredentials:mywellness.com
          - webcredentials:widgets.mywellness.com
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sdimambro.wellness-booking
    settings:
      base:
        PRODUCT_NAME: Wellness Booking
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.wellness-booking
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wellness Booking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-verde AppIcon-arancione AppIcon-viola AppIcon-rosso AppIcon-grafite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
  WellnessBookingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Localizable.xcstrings
      - path: WellnessBooking/Core/Localization.swift
      - path: Icons/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_NAME: Wellness Booking
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.wellness-booking.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SupportFiles/Watch-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wellness Booking
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
  WellnessBookingWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
      - path: Localizable.xcstrings
    entitlements:
      path: SupportFiles/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sdimambro.wellness-booking
    info:
      path: SupportFiles/Widget-Info.plist
      properties:
        CFBundleDisplayName: Wellness Booking
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WellnessBookingWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.sdimambro.wellness-booking.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
